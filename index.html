:root{
  --sky:#1a1836;
  --sky-deep:#14132c;
  --ink:#f6f1e6;
  --muted:#c9c4d4;
  --accent:#e4c56a;
  --ease:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS","Segoe UI",sans-serif;
  background:
    radial-gradient(1.4px 1.4px at 18% 14%, rgba(255,255,255,.45), transparent 2px),
    radial-gradient(1.1px 1.1px at 74% 11%, rgba(255,255,255,.32), transparent 2px),
    radial-gradient(1px 1px at 42% 28%, rgba(255,255,255,.22), transparent 2px),
    radial-gradient(1.3px 1.3px at 88% 34%, rgba(255,255,255,.28), transparent 2px),
    radial-gradient(1px 1px at 12% 62%, rgba(255,255,255,.18), transparent 2px),
    radial-gradient(1.2px 1.2px at 66% 72%, rgba(255,255,255,.2), transparent 2px),
    radial-gradient(1px 1px at 30% 86%, rgba(255,255,255,.16), transparent 2px),
    linear-gradient(180deg, #1c1a3c 0%, #22264c 52%, #1a243f 100%);
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:
    max(8px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(10px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}
.bar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  flex:none;
  gap:8px;
}
#back{justify-self:start}
#next{justify-self:end}
.chev{
  width:88px;height:88px;
  border:1.5px solid rgba(228,197,106,.55);
  background:rgba(255,255,255,.05);
  color:var(--accent);
  font-size:2.4rem;line-height:1;
  border-radius:50%;
  padding:0;
  touch-action:manipulation;
  transition:transform 140ms var(--ease);
}
.chev.is-word{
  width:auto;
  min-width:0;
  height:64px;
  padding:0 14px;
  border-radius:999px;
  font-size:1.02rem;
  font-weight:700;
  letter-spacing:-.02em;
}
.chev:active{transform:scale(0.97)}
.chev.is-off{visibility:hidden}
.lock{text-align:center;min-width:0}
.numeral{
  margin:0;
  font-size:clamp(3.4rem, 15vw, 4.8rem);
  line-height:.86;
  letter-spacing:-.04em;
  font-weight:800;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.numeral.is-title{
  font-size:clamp(1.4rem, 5.6vw, 2.5rem);
  letter-spacing:-.03em;
  color:var(--ink);
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.kannada{
  margin:4px 0 0;
  min-height:1.35em;
  font-family:"Blocks Kannada","Noto Sans Kannada","Kannada MN",sans-serif;
  font-size:clamp(1.45rem, 5.6vw, 1.85rem);
  line-height:1.35;
  color:var(--ink);
}
.en{
  margin:0;
  min-height:1.2em;
  font-weight:700;
  font-size:1.05rem;
  letter-spacing:.04em;
  color:var(--muted);
}
.en:empty{display:none}
.said{
  margin:2px 0 0;
  min-height:0;
  font-weight:700;
  font-size:.95rem;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.said:empty{display:none}
#stage{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
  overflow:hidden;
}
#screen-number,#screen-together{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  position:relative;
}
#screen-together{justify-content:center;gap:10px}
#screen-number::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:2px;
  width:42%;
  height:16px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(255,255,255,.07), transparent 70%);
  pointer-events:none;
}
.tower{
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  padding:8px 6px 6px;
  position:relative;
  z-index:1;
}
.tower.row{
  flex-direction:row;
  align-items:flex-end;
  justify-content:center;
  width:100%;
}
.cube{
  border:0;padding:0;margin:0;
  border-radius:0;
  background:transparent;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  flex:none;
  position:relative;
  box-shadow:none;
  transition:transform 160ms var(--ease);
  touch-action:manipulation;
}
.planet-art{
  width:var(--disk, 96px);
  height:var(--disk, 96px);
  flex:none;
  display:block;
}
.planet-svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  filter:drop-shadow(0 3px 3px rgba(8,6,20,.35));
}
.planet-name{
  flex:none;
  font-weight:700;
  font-size:var(--name, 14px);
  line-height:1.1;
  letter-spacing:.01em;
  color:var(--ink);
  text-align:center;
  white-space:nowrap;
}
.cube.counted .planet-art{
  border-radius:50%;
  outline:3px solid var(--accent);
  outline-offset:1px;
}
.cube:active{transform:scale(0.97)}
.ghost{
  flex:none;
  width:88px;height:88px;
  display:grid;place-items:center;
  border-radius:50%;
  border:2.5px dashed rgba(228,197,106,.8);
  background:transparent;
  color:var(--accent);
  font:inherit;
  font-weight:600;
  font-size:2.6rem;
  line-height:1;
  padding:0;
  touch-action:manipulation;
  transition:transform 140ms var(--ease);
}
.ghost:active{transform:scale(0.97)}
.rocket{
  position:absolute;
  right:max(4px, 5vw);
  top:42%;
  width:40px;
  z-index:1;
  pointer-events:none;
  animation:drift 3.4s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
.world{
  flex:none;
  margin:0;
  padding:6px 12px 2px;
  text-align:center;
  color:var(--muted);
  font-size:.95rem;
  line-height:1.3;
  overflow-wrap:anywhere;
}
.fact{
  width:min(100%,520px);
  min-width:0;
  padding:2px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.fact-num{
  margin:0;
  text-align:center;
  font-size:1.7rem;
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.piles{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:8px;
  margin-top:6px;
  max-width:100%;
}
.pile{
  min-width:0;
  min-height:0;
  padding:6px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:max(4px, calc(var(--star, 40px) * 0.16));
  touch-action:manipulation;
  transition:transform 140ms var(--ease);
}
.pile:active{transform:scale(0.97)}
.star{
  flex:none;
  width:var(--star, 40px);
  height:var(--star, 40px);
  display:block;
}
.and{
  font-weight:700;
  color:var(--muted);
  align-self:center;
  font-size:1.05rem;
  flex:none;
  line-height:1;
}
.fact-line{
  margin:8px 0 0;
  text-align:center;
  font-weight:700;
  min-height:1.25em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.chev:focus-visible,.ghost:focus-visible,.pile:focus-visible,.cube:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}
html.land .numeral{font-size:2.3rem}
html.land .numeral.is-title{font-size:1.7rem}
html.land .kannada{font-size:1.15rem;min-height:1.2em}
html.land .en,.html.land .said{font-size:.9rem}
html.land .world{font-size:.85rem;padding-top:2px}
html.land #screen-together{flex-direction:row;align-items:center;justify-content:center;gap:8px}
html.land .fact{flex:1 1 0;width:auto}
html.land .chev{width:64px;height:64px;font-size:1.8rem}
html.land .chev.is-word{width:auto;height:48px;font-size:.85rem;padding:0 10px}
html.land .rocket{display:none}
@media (max-width:430px){
  .chev{width:68px;height:68px;font-size:2rem}
  .chev.is-word{height:52px;font-size:.95rem;padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
  .chev,.ghost,.pile,.cube{transition:none}
  .chev:active,.ghost:active,.pile:active,.cube:active{transform:none}
  .rocket{animation:none}
}

</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="chev" id="back" type="button" aria-label="Back">‹</button>
    <div class="lock">
      <h1 class="numeral" id="numeral">1</h1>
      <p class="kannada" id="kannada" lang="kn">ಒಂದು</p>
      <p class="en" id="en">one</p>
      <p class="said" id="said" aria-live="polite"></p>
    </div>
    <button class="chev" id="next" type="button" aria-label="Next">›</button>
  </header>
  <div id="stage"></div>
  <p class="world" id="world-text">Hold up 1 finger.</p>
</div>
<script>
/* Counting towers. One tap adds a planet. Together opens the
   addition screen. Planets stay in solar order, Mercury first. */
(function () {
  'use strict';

      var mid = Math.floor((lo + hi) / 2);
      if (fits(mid)) {
        best = mid;
        lo = mid + 1;
      } else hi = mid - 1;
    }
    screen.style.setProperty('--star', best + 'px');
  }
  function applySize() {
    document.documentElement.classList.toggle('land', landscape());
    var screen = document.getElementById('screen-number');
    var blocks = document.getElementById('blocks');
    if (screen && blocks) {
      var land = landscape();
      blocks.classList.toggle('row', land);
      var ghost = document.getElementById('add-one');
      var limitW = Math.max(0, screen.clientWidth - 8);
      var limitH = Math.max(0, screen.clientHeight - 8);
      var lo = 34;
      var hi = land ? 132 : 148;
      var best = lo;
      while (lo <= hi) {
        var mid = Math.floor((lo + hi) / 2);
        applyDisk(blocks, ghost, mid, land);
        var box = towerBox(blocks);
        if (box.w <= limitW && box.h <= limitH) {
          best = mid;
          lo = mid + 1;
        } else hi = mid - 1;
      }
      applyDisk(blocks, ghost, best, land);
    }
    layoutStars();
  }
  function makeRocket() {
    var el = document.createElement('div');
    el.className = 'rocket';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<svg viewBox="0 0 64 88" width="40" height="55" focusable="false"><path d="M32 4c11 14 17 30 17 48H15C15 34 21 18 32 4z" fill="#f4f0e6"/><path d="M15 48l-9 16 13-7z" fill="#c9bdd4"/><path d="M49 48l9 16-13-7z" fill="#c9bdd4"/><circle cx="32" cy="34" r="6" fill="#6f9e96"/><path d="M27 54l5 12 5-12z" fill="#e0a878"/></svg>';
    return el;
  }
  function pile(count) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pile';
    btn.setAttribute('aria-label', count + (count === 1 ? ' star' : ' stars'));
    var i;
    for (i = 0; i < count; i++) btn.appendChild(starSvg());
    return btn;
  }
  function renderFact(total, parts) {
    var section = document.createElement('section');
    section.className = 'fact';
    section.id = 'fact-' + total;
    section.setAttribute('data-total', String(total));
    section.setAttribute('data-joined', joined[total] ? 'true' : 'false');
    var num = document.createElement('p');
    num.className = 'fact-num';
    num.textContent = String(total);
    section.appendChild(num);
    var piles = document.createElement('div');
    piles.className = 'piles';
    if (joined[total]) {
      piles.appendChild(pile(total));
    } else {
      piles.appendChild(pile(parts[0]));
      var and = document.createElement('span');
      and.className = 'and';
      and.textContent = 'and';
      piles.appendChild(and);
      piles.appendChild(pile(parts[1]));
    }
    section.appendChild(piles);
    var lineEl = document.createElement('p');
    lineEl.className = 'fact-line';
    lineEl.setAttribute('aria-live', 'polite');
    lineEl.textContent = factLine[total];
    section.appendChild(lineEl);
    return section;
  }
  function render(motion) {
    var prev = motion ? snapshot() : [];
    var info = NUMBERS[Math.min(index, 4)];
    var show = six ? 6 : info.n;
    document.documentElement.classList.toggle('land', landscape());
    backBtn.classList.toggle('is-off', index === 0);
    backBtn.disabled = index === 0;
    if (index === 0) backBtn.setAttribute('aria-hidden', 'true');
    else backBtn.removeAttribute('aria-hidden');
    nextBtn.textContent = index === 5 ? '↻' : 'Together';
    nextBtn.setAttribute('aria-label', index === 5 ? 'Again' : 'Together');
    nextBtn.classList.toggle('is-word', index !== 5);
    stage.textContent = '';
    if (index < 5) {
      numeral.classList.remove('is-title');
      numeral.textContent = String(show);
      kannada.textContent = six ? '' : info.kn;
      if (enEl) enEl.textContent = six ? 'six' : info.en;
      said.textContent = line;
      world.textContent = six ? 'Six is for another day.' : info.world;
      var screen = document.createElement('div');
      screen.id = 'screen-number';
      screen.setAttribute('data-n', String(show));
      var blocks = document.createElement('div');
      blocks.id = 'blocks';
      blocks.className = 'tower';
      for (var i = 0; i < show; i++) blocks.appendChild(makeCube(i));
      var ghost = document.createElement('button');
      ghost.type = 'button';
      ghost.className = 'ghost';
      ghost.id = 'add-one';
      if (six) {
        ghost.textContent = '5';
        ghost.setAttribute('aria-label', 'Back to 5');
      } else {
        ghost.textContent = '+';
        ghost.setAttribute('aria-label', 'Add one');
      }
      blocks.appendChild(ghost);
      screen.appendChild(blocks);
      if (show === 5 && !six) screen.appendChild(makeRocket());
      stage.appendChild(screen);
      applySize();
      if (motion) playFlip(prev);
    } else {
      numeral.textContent = 'Together';
      numeral.classList.add('is-title');
      kannada.textContent = '';
      if (enEl) enEl.textContent = '';
      said.textContent = '';
      world.textContent = 'Tap to join. Tap to split.';
      var together = document.createElement('div');
      together.id = 'screen-together';
      together.appendChild(renderFact(4, [2, 2]));
      together.appendChild(renderFact(5, [3, 2]));
      stage.appendChild(together);
      applySize();
    }
  }
  function onBlock(btn) {
    var n = btn.getAttribute('data-count');
    if (!n) {
      n = String(document.querySelectorAll('#blocks .cube[data-count]').length + 1);
      btn.setAttribute('data-count', n);
      btn.classList.add('counted');
    }
    var nameEl = btn.querySelector('.planet-name');
    if (nameEl) btn.setAttribute('aria-label', nameEl.textContent);
    pop(btn);
    var info = wordFor(Number(n));
    if (!info) return;
    said.textContent = info.kn ? (info.en + ' · ' + info.kn) : info.en;
    say(info.en, info.kn || '');
  }
  function onAdd() {
    if (six) {
      six = false;
      line = '';
      render(false);
      return;
    }
    var info = NUMBERS[index];
    line = info.n + ' and 1 make ' + (info.n + 1);
    if (info.n < 5) index += 1;
    else six = true;
    render(true);
    say(line, '');
  }
  function toggleFact(total, parts) {
    if (joined[total]) {
      joined[total] = false;
      line = total + ' is ' + parts[0] + ' and ' + parts[1];
    } else {
      joined[total] = true;
      line = parts[0] + ' and ' + parts[1] + ' make ' + total;
    }
    factLine[total] = line;
    render(false);
    var pileEl = document.querySelector('#fact-' + total + ' .pile');
    if (pileEl) pop(pileEl);
    say(line, '');
  }
  function onNext() {
    line = '';
    if (index < 5) {
      returnIndex = index;
      returnSix = six;
      index = 5;
      render(false);
      return;
    }
    index = 0;
    six = false;
    returnIndex = 0;
    returnSix = false;
    joined[4] = false;
    joined[5] = false;
    factLine[4] = '2 and 2';
    factLine[5] = '3 and 2';
    render(false);
  }
  stage.addEventListener('click', function (e) {
    if (e.target.closest('#add-one')) { onAdd(); return; }
    var pileBtn = e.target.closest('.pile');
    if (pileBtn) {
      var fact = pileBtn.closest('.fact');
      var total = Number(fact.getAttribute('data-total'));
      toggleFact(total, total === 4 ? [2, 2] : [3, 2]);
      return;
    }
    if (index >= 5) return;
    var cube = e.target.closest('#blocks .cube');
    if (!cube) cube = document.querySelector('#blocks .cube:not(.counted)');
    if (cube) onBlock(cube);
  });
  backBtn.addEventListener('click', function () {
    if (index === 0) return;
    line = '';
    if (index === 5) {
      index = returnIndex;
      six = returnSix;
      render(false);
      return;
    }
    if (six) { six = false; render(false); return; }
    index -= 1;
    render(false);
  });
  nextBtn.addEventListener('click', onNext);
  window.addEventListener('resize', function () { applySize(); });
  prepareVoice();
  render(false);
})();
</script>
</body>
</html>
