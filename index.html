:root{
  --navy:#0c1730;
  --navy-mid:#132444;
  --navy-deep:#0a1224;
  --ink:#f4f7ff;
  --dim:#c5d2e2;
  --gold:#e4c56a;
  --glass:rgba(255,255,255,.07);
  --line:rgba(228,197,106,.6);
  --ease:cubic-bezier(0.23,1,0.32,1);
  --display:clamp(2.75rem,14vw,3.5rem);
  --title:2rem;
  --body-lg:1.375rem;
  --body:1rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{font-size:16px}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS","Segoe UI",sans-serif;
  background:var(--navy-deep);
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-mid) 52%,#0e1c36 100%);
  padding:
    max(8px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}
.sky{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.sky i{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  opacity:.72;
}
.sky i.lg{width:4px;height:4px;opacity:.9}
.sky i.twinkle{animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{
  0%,100%{opacity:.28}
  50%{opacity:.95}
}
.bar,#stage,.world{position:relative;z-index:1}
.bar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  flex:none;
  gap:8px;
}
#back{justify-self:start}
#next{justify-self:end}
.chev{
  width:72px;height:72px;
  border:1.5px solid var(--line);
  background:var(--glass);
  color:var(--gold);
  font-size:2rem;line-height:1;
  border-radius:22px;
  padding:0;
  touch-action:manipulation;
  transition:transform 160ms var(--ease), background-color 160ms var(--ease);
}
.chev.is-word{
  width:auto;
  min-width:72px;
  height:72px;
  padding:0 16px;
  font-size:var(--body);
  font-weight:800;
  letter-spacing:-.02em;
}
.chev:active{transform:scale(0.97)}
.chev.is-off{visibility:hidden}
.lock{text-align:center;min-width:0;padding-top:2px}
.numeral{
  margin:0;
  font-size:var(--display);
  line-height:.88;
  letter-spacing:-.04em;
  font-weight:800;
  color:var(--gold);
  font-variant-numeric:tabular-nums;
}
.numeral.is-title{
  font-size:var(--title);
  letter-spacing:-.03em;
  color:var(--ink);
  font-weight:800;
  line-height:1;
  white-space:nowrap;
  padding-top:18px;
}
.kannada{
  margin:6px 0 0;
  min-height:1.4em;
  font-family:"Blocks Kannada","Noto Sans Kannada","Kannada MN",sans-serif;
  font-size:var(--body-lg);
  font-weight:700;
  line-height:1.4;
  color:var(--ink);
}
.en{
  margin:2px 0 0;
  min-height:1.25em;
  font-weight:700;
  font-size:var(--body);
  letter-spacing:.02em;
  color:var(--dim);
}
.en:empty{display:none}
.said{
  position:relative;
  z-index:1;
  margin:4px 0 0;
  min-height:1.25em;
  text-align:center;
  font-weight:700;
  font-size:var(--body);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.said:empty{visibility:hidden}
#stage{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
  z-index:1;
  overflow:hidden;
}
#screen-number,#screen-together{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  position:relative;
}
#screen-together{justify-content:center;gap:18px;padding:8px 0}
#screen-number.is-entering,#screen-together.is-entering{
  animation:rise 220ms var(--ease) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.tower{
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  padding:4px 4px 2px;
  position:relative;
  z-index:1;
}
.tower.row{
  flex-direction:row;
  align-items:flex-end;
  justify-content:center;
  width:100%;
}
.cube{
  border:0;padding:0;margin:0;
  border-radius:0;
  background:transparent;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  flex:none;
  position:relative;
  box-shadow:none;
  transition:transform 160ms var(--ease);
  touch-action:manipulation;
}
.planet-art{
  width:var(--disk, 96px);
  height:var(--disk, 96px);
  flex:none;
  display:block;
}
.planet-svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  filter:drop-shadow(0 3px 3px rgba(8,6,20,.35));
}
.planet-name{
  flex:none;
  font-weight:700;
  font-size:var(--body);
  line-height:1.15;
  letter-spacing:.01em;
  color:var(--ink);
  text-align:center;
  white-space:nowrap;
}
.cube.counted .planet-art{
  border-radius:50%;
  outline:3px solid var(--gold);
  outline-offset:2px;
}
.cube:active{transform:scale(0.97)}
.ghost{
  flex:none;
  width:72px;height:72px;
  display:grid;place-items:center;
  border-radius:50%;
  border:2.5px dashed rgba(228,197,106,.85);
  background:transparent;
  color:var(--gold);
  font:inherit;
  font-weight:600;
  font-size:2rem;
  line-height:1;
  padding:0;
  touch-action:manipulation;
  transition:transform 160ms var(--ease);
}
.ghost:active{transform:scale(0.97)}
.rocket{
  position:absolute;
  right:max(4px, 5vw);
  top:42%;
  width:40px;
  z-index:1;
  pointer-events:none;
  animation:drift 3.4s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
.world{
  position:relative;
  z-index:1;
  flex:none;
  margin:0;
  padding:8px 8px 2px;
  text-align:center;
  color:var(--ink);
  font-size:var(--body);
  font-weight:700;
  line-height:1.3;
  overflow-wrap:anywhere;
}
.fact{
  width:min(100%,420px);
  min-width:0;
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:stretch;
}
.fact-num{
  margin:0;
  text-align:center;
  font-size:var(--body-lg);
  font-weight:800;
  letter-spacing:-.03em;
  line-height:1;
  color:var(--gold);
  font-variant-numeric:tabular-nums;
}
.piles{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:12px;
  margin-top:8px;
  max-width:100%;
}
.pile{
  min-width:0;
  min-height:0;
  padding:10px 12px;
  border:0;
  border-radius:28px;
  background:var(--glass);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:max(6px, calc(var(--star, 40px) * 0.12));
  touch-action:manipulation;
}
.fact[data-joined="true"] .pile{
  flex-direction:row;
  align-items:center;
  border-radius:24px;
}
.token{
  flex:none;
  width:var(--star, 48px);
  height:var(--star, 48px);
  padding:0;
  border:0;
  border-radius:18%;
  background:transparent;
  display:block;
  touch-action:manipulation;
  transition:transform 160ms var(--ease);
}
.token.star{border-radius:50%}
.token svg{
  width:100%;
  height:100%;
  display:block;
  filter:drop-shadow(0 3px 4px rgba(8,6,20,.35));
}
.token:active,.join:active{transform:scale(0.97)}
.token.is-lit{box-shadow:0 0 0 3px var(--gold)}
.join{
  margin-top:10px;
  width:100%;
  min-height:64px;
  padding:0 18px;
  border:0;
  border-radius:22px;
  background:var(--gold);
  color:var(--navy);
  font:inherit;
  font-weight:800;
  font-size:var(--body-lg);
  letter-spacing:.01em;
  box-shadow:0 8px 18px rgba(8,6,20,.35);
  touch-action:manipulation;
  transition:transform 160ms var(--ease), background-color 160ms var(--ease);
}
.and{
  font-weight:800;
  color:var(--dim);
  align-self:center;
  font-size:var(--body);
  flex:none;
  line-height:1;
}
.fact-line{
  margin:8px 0 0;
  text-align:center;
  font-weight:700;
  min-height:1.3em;
  font-size:var(--body);
  color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.fact[data-joined="true"] .fact-line{
  color:var(--gold);
  font-size:var(--body-lg);
  font-weight:800;
}
.chev:focus-visible,.ghost:focus-visible,.join:focus-visible,.token:focus-visible,.cube:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}
@media (hover:hover) and (pointer:fine){
  .chev:hover,.ghost:hover,.join:hover{background:rgba(255,255,255,.12)}
  .join:hover{background:#f0d27a}
}
html.land .bar{align-items:center}
html.land .numeral{font-size:2.25rem}
html.land .numeral.is-title{font-size:1.75rem;padding-top:0}
html.land .kannada{font-size:var(--body);min-height:1.25em;margin-top:2px}
html.land .said{margin-top:0}
html.land .world{padding-top:2px}
html.land #screen-together{flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:0}
html.land .fact{
  flex:1 1 0;
  width:auto;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"num piles" "line join";
  column-gap:8px;
  row-gap:4px;
  align-items:center;
  justify-items:center;
}
html.land .fact-num{grid-area:num;font-size:var(--body);margin:0}
html.land .piles{grid-area:piles;margin:0;justify-self:stretch}
html.land .fact-line{grid-area:line;margin:0;white-space:nowrap}
html.land .fact[data-joined="true"] .fact-line{font-size:var(--body)}
html.land .pile{padding:4px 6px;border-radius:18px}
html.land .chev{width:60px;height:60px;font-size:1.75rem;border-radius:18px}
html.land .chev.is-word{width:auto;height:60px;padding:0 12px}
html.land .rocket{display:none}
html.land .join{grid-area:join;min-height:60px;margin-top:0;font-size:var(--body);border-radius:18px}
html.is-tight .numeral{font-size:clamp(2.5rem,12vw,3rem)}
html.land.is-tight .numeral{font-size:2rem}
@media (max-width:360px){
  .chev{width:64px;height:64px;border-radius:18px}
  .chev.is-word{min-width:64px;height:64px}
  .numeral.is-title{font-size:1.75rem;padding-top:14px}
}
@media (min-width:900px) and (min-height:780px){
  body{display:grid;place-items:center}
  .app{
    width:430px;
    height:min(844px,calc(100dvh - 48px));
    border-radius:28px;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
}
@media (prefers-reduced-motion:reduce){
  .chev,.ghost,.join,.token,.cube{transition:none}
  .chev:active,.ghost:active,.join:active,.token:active,.cube:active{transform:none}
  .rocket,.sky i.twinkle,#screen-number.is-entering,#screen-together.is-entering{animation:none}
}

    },
    {
      id: 'neptune',
      name: 'Neptune',
      svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="planet-svg"><defs><radialGradient id="neptune-shade" cx="34%" cy="30%" r="74%"><stop offset="0%" stop-color="#9ebaf0"/><stop offset="42%" stop-color="#2a4ec0"/><stop offset="100%" stop-color="#0c1c6e"/></radialGradient><clipPath id="neptune-clip"><circle cx="50" cy="50" r="47"/></clipPath></defs><g clip-path="url(#neptune-clip)"><circle cx="50" cy="50" r="47" fill="url(#neptune-shade)"/><rect data-band="1" y="30" width="100" height="7" fill="#1a3c96"/><rect data-band="1" y="42" width="100" height="5" fill="#8eaeec" opacity=".6"/><rect data-band="1" y="56" width="100" height="8" fill="#142f78"/><rect data-band="1" y="70" width="100" height="5" fill="#a9c0ef" opacity=".45"/><ellipse cx="63" cy="47" rx="8" ry="4" fill="#d7e6ff" opacity=".55"/><circle cx="50" cy="50" r="47" fill="url(#neptune-shade)" opacity=".16"/></g></svg>'
    }
  ];
  function svgFrom(markup) {
    var tpl = document.createElement('template');
    tpl.innerHTML = markup;
    return tpl.content.firstElementChild;
  }
  function makeCube(i) {
    var planet = PLANETS[i];
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'cube';
    el.setAttribute('data-i', String(i));
    el.setAttribute('data-planet', planet.id);
    el.setAttribute('aria-label', planet.name);
    var art = document.createElement('span');
    art.className = 'planet-art';
    art.setAttribute('aria-hidden', 'true');
    art.appendChild(svgFrom(planet.svg));
    var label = document.createElement('span');
    label.className = 'planet-name';
    label.textContent = planet.name;
    el.appendChild(art);
    el.appendChild(label);
    return el;
  }
  function starSvg(tone) {
    var colors = STAR_TONE[tone] || STAR_TONE.gold;
    function ring(outer, inner) {
      var parts = [];
      var i;
      for (i = 0; i < 10; i++) {
        var radius = i % 2 ? inner : outer;
        var angle = -Math.PI / 2 + i * Math.PI / 5;
        var x = 50 + radius * Math.cos(angle);
        var y = 50 + radius * Math.sin(angle);
        parts.push((i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2));
      }
      return parts.join('') + 'Z';
    }
    var face = tone === 'ice' ? '#1a3348' : '#5c3d16';
    var el = svgFrom(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="' + colors[0] + '" d="' + ring(46, 19) + '"/><path fill="' + colors[1] + '" d="' + ring(20, 8) + '"/>' +
      '<circle data-face="1" cx="42" cy="46" r="3.1" fill="' + face + '"/><circle data-face="1" cx="58" cy="46" r="3.1" fill="' + face + '"/>' +
      '<path data-face="1" d="M40 58c6 7 14 7 20 0" fill="none" stroke="' + face + '" stroke-width="3" stroke-linecap="round"/></svg>'
    );
    el.setAttribute('aria-hidden', 'true');
    return el;
  }
  function rocketSvg(tone) {
    var pal = SHIP_TONE[tone] || SHIP_TONE.coral;
    var el = svgFrom(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
        '<path data-flame="1" fill="' + pal.flame + '" d="M43 76c2 12 12 12 14 0-3 5-11 5-14 0z"/>' +
        '<path data-fin="1" fill="' + pal.fin + '" d="M32 58 L16 78 L36 68 Z"/>' +
        '<path data-fin="1" fill="' + pal.fin + '" d="M68 58 L84 78 L64 68 Z"/>' +
        '<path data-body="1" fill="' + pal.body + '" d="M50 16c13 16 16 32 16 48H34c0-16 3-32 16-48z"/>' +
        '<circle data-window="1" cx="50" cy="46" r="8" fill="' + pal.glass + '"/>' +
        '<circle cx="50" cy="46" r="3.6" fill="' + pal.dot + '"/>' +
      '</svg>'
    );
    el.setAttribute('aria-hidden', 'true');
    return el;
  }
  function pop(el) {
    if (reduce || !el.animate) return;
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.animate([
      { transform: 'scale(0.96)' },
      { transform: 'scale(1.035)', offset: 0.42 },
      { transform: 'scale(1)' }
    ], { duration: 260, easing: EASE });
  }
  function snapshot() {
    return Array.prototype.map.call(stage.querySelectorAll('#blocks .cube'), function (el) {
      return { i: el.getAttribute('data-i'), box: el.getBoundingClientRect() };
    });
  }
  function glide(el, old) {
    var box = el.getBoundingClientRect();
    if (!old || !box.width) {
      el.animate([
        { transform: 'translateY(10px) scale(0.96)', opacity: 0 },
        { transform: 'none', opacity: 1 }
      ], { duration: 220, easing: EASE });
      return;
    }
    var dx = (old.left + old.width / 2) - (box.left + box.width / 2);
    var dy = (old.top + old.height / 2) - (box.top + box.height / 2);
    var s = old.width / box.width;
    if (!isFinite(s) || s <= 0) s = 1;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(s - 1) < 0.02) return;
    el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' },
      { transform: 'none' }
    ], { duration: 260, easing: EASE });
  }
  function playFlip(prev) {
    if (reduce || !prev.length) return;
    var map = {};
    prev.forEach(function (p) { map[p.i] = p.box; });
    Array.prototype.forEach.call(stage.querySelectorAll('#blocks .cube'), function (el) {
      glide(el, map[el.getAttribute('data-i')]);
    });
  }
  function snapshotTokens() {
    return Array.prototype.map.call(stage.querySelectorAll('.token'), function (el) {
      var fact = el.closest('.fact');
      return {
        key: (fact ? fact.getAttribute('data-total') : '') + ':' + el.getAttribute('data-i'),
        box: el.getBoundingClientRect()
      };
    });
  }
  function playTokenFlip(prev) {
    if (reduce || !prev.length) return;
    var map = {};
    prev.forEach(function (p) { map[p.key] = p.box; });
    Array.prototype.forEach.call(stage.querySelectorAll('.token'), function (el) {
      var fact = el.closest('.fact');
      var key = (fact ? fact.getAttribute('data-total') : '') + ':' + el.getAttribute('data-i');
      glide(el, map[key]);
    });
  }
  function applyDisk(blocks, ghost, disk, land) {
    blocks.style.setProperty('--disk', disk + 'px');
    blocks.style.setProperty('--name', '16px');
    if (!ghost) return;
    var g = Math.round(disk * 0.9);
    if (g > 88) g = 88;
    if (g < 64) g = 64;
    ghost.style.width = g + 'px';
    ghost.style.height = g + 'px';
    ghost.style.fontSize = Math.round(g * 0.46) + 'px';
    ghost.style.marginBottom = land ? 'calc(var(--name) * 1.1 + 4px)' : '0px';
  }
  function towerBox(blocks) {
    var blockStyle = window.getComputedStyle(blocks);
    var land = blocks.classList.contains('row');
    var gap = parseFloat(blockStyle.gap) || 0;
    var main = 0;
    var cross = 0;
    var seen = 0;
    Array.prototype.forEach.call(blocks.children, function (el) {
      var style = window.getComputedStyle(el);
      var extraMain = land
        ? (parseFloat(style.marginLeft) || 0) + (parseFloat(style.marginRight) || 0)
        : (parseFloat(style.marginTop) || 0) + (parseFloat(style.marginBottom) || 0);
      var extraCross = land
        ? (parseFloat(style.marginTop) || 0) + (parseFloat(style.marginBottom) || 0)
        : (parseFloat(style.marginLeft) || 0) + (parseFloat(style.marginRight) || 0);
      if (land) {
        main += el.offsetWidth + extraMain;
        cross = Math.max(cross, el.offsetHeight + extraCross);
      } else {
        main += el.offsetHeight + extraMain;
        cross = Math.max(cross, el.offsetWidth + extraCross);
      }
      seen += 1;
    });
    if (seen > 1) main += gap * (seen - 1);
    var box = land ? { w: main, h: cross } : { w: cross, h: main };
    box.w += (parseFloat(blockStyle.paddingLeft) || 0) + (parseFloat(blockStyle.paddingRight) || 0);
    box.h += (parseFloat(blockStyle.paddingTop) || 0) + (parseFloat(blockStyle.paddingBottom) || 0);
    return box;
  }
  function layoutStars() {
    var screen = document.getElementById('screen-together');
    if (!screen) return;
    function fits(size) {
      screen.style.setProperty('--star', size + 'px');
      var bounds = screen.getBoundingClientRect();
      var styles = window.getComputedStyle(screen);
      var facts = screen.querySelectorAll('.fact');
      var row = styles.flexDirection.indexOf('row') === 0;
      var gap = parseFloat(row ? styles.columnGap || styles.gap : styles.rowGap || styles.gap) || 0;
      var usedMain = 0;
      var usedCross = 0;
      Array.prototype.forEach.call(facts, function (fact) {
        if (row) {
          usedMain += fact.offsetWidth;
          usedCross = Math.max(usedCross, fact.offsetHeight);
        } else {
          usedMain += fact.offsetHeight;
          usedCross = Math.max(usedCross, fact.offsetWidth);
        }
      });
      if (facts.length > 1) usedMain += gap * (facts.length - 1);
      if (row) {
        if (usedMain > bounds.width + 1 || usedCross > bounds.height + 1) return false;
      } else if (usedMain > bounds.height + 1 || usedCross > bounds.width + 1) return false;
      var bits = screen.querySelectorAll('.token, .fact-num, .fact-line, .and, .join');
      var i;
      for (i = 0; i < bits.length; i++) {
        var rect = bits[i].getBoundingClientRect();
        if (rect.width < 1 || rect.height < 1) return false;
        if (rect.left < bounds.left - 0.5 || rect.top < bounds.top - 0.5) return false;
        if (rect.right > bounds.right + 0.5 || rect.bottom > bounds.bottom + 0.5) return false;
      }
      var tokens = screen.querySelectorAll('.token');
      for (i = 0; i < tokens.length; i++) {
        var token = tokens[i].getBoundingClientRect();
        if (token.width < size - 1.5 || token.height < size - 1.5) return false;
      }
      return true;
    }
    var lo = 22;
    var hi = 64;
    var best = 22;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      if (fits(mid)) {
        best = mid;
        lo = mid + 1;
      } else hi = mid - 1;
    }
    screen.style.setProperty('--star', best + 'px');
  }
  function applySize() {
    markChrome();
    var screen = document.getElementById('screen-number');
    var blocks = document.getElementById('blocks');
    if (screen && blocks) {
      var land = landscape();
      blocks.classList.toggle('row', land);
      var ghost = document.getElementById('add-one');
      var limitW = Math.max(0, screen.clientWidth - 4);
      var limitH = Math.max(0, screen.clientHeight - 4);
      var lo = 28;
      var hi = land ? 120 : 140;
      var best = lo;
      while (lo <= hi) {
        var mid = Math.floor((lo + hi) / 2);
        applyDisk(blocks, ghost, mid, land);
        var box = towerBox(blocks);
        if (box.w <= limitW && box.h <= limitH) {
          best = mid;
          lo = mid + 1;
        } else hi = mid - 1;
      }
      applyDisk(blocks, ghost, best, land);
    }
    layoutStars();
  }
  function makeRocket() {
    var el = document.createElement('div');
    el.className = 'rocket';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<svg viewBox="0 0 64 88" width="40" height="55" focusable="false"><path d="M32 4c11 14 17 30 17 48H15C15 34 21 18 32 4z" fill="#f4f7ff"/><path d="M15 48l-9 16 13-7z" fill="#9eb6d4"/><path d="M49 48l9 16-13-7z" fill="#9eb6d4"/><circle cx="32" cy="34" r="6" fill="#6f9e96"/><path d="M27 54l5 12 5-12z" fill="#e4c56a"/></svg>';
    return el;
  }
  function makeToken(kind, tone, n) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'token ' + (kind === 'star' ? 'star' : 'ship');
    btn.setAttribute('data-kind', kind);
    btn.setAttribute('data-tone', tone);
    btn.setAttribute('data-n', String(n));
    btn.setAttribute('aria-label', NUMBERS[n - 1].en);
    btn.appendChild(kind === 'star' ? starSvg(tone) : rocketSvg(tone));
    return btn;
  }
  function makePile(kind, tones, start) {
    var group = document.createElement('div');
    group.className = 'pile';
    tones.forEach(function (tone, i) {
      var token = makeToken(kind, tone, i + 1);
      token.setAttribute('data-i', String(start + i));
      group.appendChild(token);
    });
    return group;
  }
  function renderFact(total) {
    var fact = FACTS[total];
    var section = document.createElement('section');
    section.className = 'fact';
    section.id = 'fact-' + total;
    section.setAttribute('data-total', String(total));
    section.setAttribute('data-kind', fact.kind);
    section.setAttribute('data-joined', joined[total] ? 'true' : 'false');
    var num = document.createElement('p');
    num.className = 'fact-num';
    num.textContent = String(total);
    section.appendChild(num);
    var piles = document.createElement('div');
    piles.className = 'piles';
    if (joined[total]) {
      piles.appendChild(makePile(fact.kind, fact.tones, 0));
    } else {
      piles.appendChild(makePile(fact.kind, fact.tones.slice(0, fact.parts[0]), 0));
      var and = document.createElement('span');
      and.className = 'and';
      and.textContent = 'and';
      piles.appendChild(and);
      piles.appendChild(makePile(fact.kind, fact.tones.slice(fact.parts[0]), fact.parts[0]));
    }
    section.appendChild(piles);
    var join = document.createElement('button');
    join.type = 'button';
    join.className = 'join';
    join.textContent = joined[total] ? 'Split' : 'Join';
    join.setAttribute('aria-label', (joined[total] ? 'Split ' : 'Join ') + fact.parts[0] + ' and ' + fact.parts[1]);
    section.appendChild(join);
    var lineEl = document.createElement('p');
    lineEl.className = 'fact-line';
    lineEl.setAttribute('aria-live', 'polite');
    lineEl.textContent = factLine[total];

  }
  function render(motion) {
    var prev = motion === 'flip' && !together ? snapshot() : [];
    var prevTokens = motion === 'flip' && together ? snapshotTokens() : [];
    var info = NUMBERS[count - 1];
    markChrome();
    backBtn.classList.toggle('is-off', !together && count === 1);
    backBtn.disabled = !together && count === 1;
    if (!together && count === 1) backBtn.setAttribute('aria-hidden', 'true');
    else backBtn.removeAttribute('aria-hidden');
    nextBtn.textContent = together ? '↻' : 'Together';
    nextBtn.setAttribute('aria-label', together ? 'Again' : 'Together');
    nextBtn.classList.toggle('is-word', !together);
    stage.textContent = '';
    if (!together) {
      numeral.classList.remove('is-title');
      numeral.textContent = String(count);
      kannada.textContent = info.kn;
      if (enEl) enEl.textContent = info.en;
      said.textContent = line;
      world.textContent = info.world;
      var screen = document.createElement('div');
      screen.id = 'screen-number';
      if (motion === 'screen') screen.classList.add('is-entering');
      screen.setAttribute('data-n', String(count));
      var blocks = document.createElement('div');
      blocks.id = 'blocks';
      blocks.className = 'tower';
      var i;
      for (i = 0; i < count; i++) blocks.appendChild(makeCube(i));
      if (count < NUMBERS.length) {
        var ghost = document.createElement('button');
        ghost.type = 'button';
        ghost.className = 'ghost';
        ghost.id = 'add-one';
        ghost.textContent = '+';
        ghost.setAttribute('aria-label', 'Add one');
        blocks.appendChild(ghost);

    } else {
      numeral.textContent = 'Together';
      numeral.classList.add('is-title');
      kannada.textContent = '';
      if (enEl) enEl.textContent = '';
      said.textContent = line;
      world.textContent = 'Tap one to count.';
      var board = document.createElement('div');
      board.id = 'screen-together';
      if (motion === 'screen') board.classList.add('is-entering');
      board.appendChild(renderFact(4));
      board.appendChild(renderFact(5));
      stage.appendChild(board);
      applySize();
      if (motion === 'flip') playTokenFlip(prevTokens);
    }

  function onPlanet(btn) {
    var i = Number(btn.getAttribute('data-i'));
    var info = NUMBERS[i];
    var planet = PLANETS[i];
    var phrase = planet.name + ', ' + info.en;
    btn.classList.add('counted');
    pop(btn);
    btn.setAttribute('aria-label', phrase);
    line = phrase;
    said.textContent = phrase;
    say(phrase, info.kn || '');
    applySize();
  }
  function onAdd() {
    if (count >= NUMBERS.length) return;
    line = count + ' and 1 make ' + (count + 1);
    count += 1;
    render('flip');
    say(line, '');
  }
  function onToken(btn) {
    var n = Number(btn.getAttribute('data-n'));
    var word = NUMBERS[n - 1].en;
    btn.classList.add('is-lit');
    pop(btn);
    line = word;
    said.textContent = word;
    say(word, '');
    applySize();
  }
  function toggleFact(total) {
    var parts = FACTS[total].parts;
    if (joined[total]) {
      joined[total] = false;
      line = total + ' is ' + parts[0] + ' and ' + parts[1];
    } else {
      joined[total] = true;
      line = parts[0] + ' and ' + parts[1] + ' make ' + total;
    }
    factLine[total] = line;
    render('flip');
    var joinEl = document.querySelector('#fact-' + total + ' .join');
    if (joinEl) pop(joinEl);
    say(line, '');
  }
  function onNext() {
    line = '';
    if (!together) {
      returnCount = count;
      together = true;
      render('screen');
      return;
    }
    together = false;
    count = 1;
    returnCount = 1;
    joined[4] = false;
    joined[5] = false;
    factLine[4] = '2 and 2';
    factLine[5] = '3 and 2';
    render('screen');
  }
  stage.addEventListener('click', function (e) {
    if (e.target.closest('#add-one')) { onAdd(); return; }
    var token = e.target.closest('.token');
    if (token) { onToken(token); return; }
    var join = e.target.closest('.join');
    if (join) {
      toggleFact(Number(join.closest('.fact').getAttribute('data-total')));
      return;
    }
    if (together) return;
    var cube = e.target.closest('#blocks .cube');
    if (cube) onPlanet(cube);
  });
  backBtn.addEventListener('click', function () {
    if (!together && count === 1) return;
    line = '';
    if (together) {
      together = false;
      count = returnCount;
      render('screen');
      return;
    }
    count -= 1;
    render('flip');
  });
  nextBtn.addEventListener('click', onNext);
  window.addEventListener('resize', function () { applySize(); });
  prepareVoice();
  render(false);
})();
